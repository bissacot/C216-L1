services:
  api:
    environment:
      EMAIL_MODE: LIVE
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: helpdesk@example.invalid
      SMTP_TO: equipe@example.invalid
      SMTP_USE_TLS: "false"
      SMTP_USE_SSL: "false"
      TEAMS_MODE: MOCK
      TEAMS_WEBHOOK_URL: ""
      TEAMS_MOCK_URL: http://teams-mock:8080/workflow
    depends_on:
      mailpit:
        condition: service_healthy
      teams-mock:
        condition: service_healthy
  teams-mock:
    profiles: ["demo"]
    build: ./backend
    command: ["python", "-m", "app.services.delivery.simulator"]
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/last', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20
