server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        resolver 127.0.0.11 valid=15s;
        set $backend api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
