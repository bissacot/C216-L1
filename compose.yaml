name: helpdesk-hub

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      EMAIL_MODE: "${EMAIL_MODE:-DISABLED}"
      TEAMS_MODE: "${TEAMS_MODE:-DISABLED}"
      APP_PUBLIC_URL: "${APP_PUBLIC_URL:-http://127.0.0.1:8001}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-1025}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-helpdesk@example.invalid}"
      SMTP_TO: "${SMTP_TO:-equipe@example.invalid}"
      SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
      SMTP_USE_SSL: "${SMTP_USE_SSL:-false}"
      SMTP_TIMEOUT: "${SMTP_TIMEOUT:-10}"
      TEAMS_WEBHOOK_URL: "${TEAMS_WEBHOOK_URL:-}"
      TEAMS_MOCK_URL: "${TEAMS_MOCK_URL:-}"
      TEAMS_TIMEOUT: "${TEAMS_TIMEOUT:-10}"
      NOTIFY_MAX_ATTEMPTS: "${NOTIFY_MAX_ATTEMPTS:-3}"
      NOTIFY_RETRY_SECONDS: "${NOTIFY_RETRY_SECONDS:-10}"
      NOTIFY_POLL_SECONDS: "${NOTIFY_POLL_SECONDS:-1}"
      NOTIFY_LEASE_SECONDS: "${NOTIFY_LEASE_SECONDS:-60}"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      NOTIFY_EMAIL_RECIPIENT: ${NOTIFY_EMAIL_RECIPIENT:-suporte-ti}
      NOTIFY_TEAMS_RECIPIENT: ${NOTIFY_TEAMS_RECIPIENT:-suporte-ti}
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27.4
    profiles: ["demo"]
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db_data:
